name: AquaShield
description: >-
  AquaShield is a Y Combinator-backed (Spring 2026 / P26 batch) startup building
  AI-driven water leak detection for buildings and large real estate portfolios.
  Non-invasive sensors clamp onto existing pipes in minutes with no pipe cutting,
  retrofits, or downtime; the platform learns each building's normal water-flow
  patterns and flags anomalies in real time before they escalate into costly
  damage. Water damage is the largest preventable loss in real estate — more than
  fire and theft combined. Founded by former MIT and Harvard/EPFL robotics
  researchers Paul Beckers (CEO) and Marguerite Benoist (CTO), the company is based
  in San Francisco and works with some of the largest residential portfolios in the
  world. This profile was surfaced as a Y Combinator portfolio company and added to
  the API Evangelist network; AquaShield currently publishes a marketing site only
  and does not yet expose a public API or developer program.
